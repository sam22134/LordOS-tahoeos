name: Desktop input and icon regression tests

on:
  push:
    branches:
      - "tahoe/**"
    paths:
      - "server/src/iconfind.c"
      - "server/src/iconfind.h"
      - "server/tests/iconfind_test.c"
      - "server/src/tp/**"
      - "server/tests/tp_test.c"
      - "server/src/inputkind.h"
      - "server/tests/inputkind_test.c"
      - "tests/touchpad-sim/**"
      - "packaging/icons/**"
      - ".github/workflows/icon-theme-tests.yml"
  pull_request:
    paths:
      - "server/src/iconfind.c"
      - "server/src/iconfind.h"
      - "server/tests/iconfind_test.c"
      - "server/src/tp/**"
      - "server/tests/tp_test.c"
      - "server/src/inputkind.h"
      - "server/tests/inputkind_test.c"
      - "tests/touchpad-sim/**"
      - "packaging/icons/**"
      - ".github/workflows/icon-theme-tests.yml"

permissions:
  contents: read

jobs:
  icon-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile icon resolver regression test
        run: cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -o /tmp/iconfind-test server/tests/iconfind_test.c server/src/iconfind.c
      - name: Run icon resolver regression test
        run: /tmp/iconfind-test
      - name: Validate installer shell syntax
        run: bash -n packaging/icons/install-mactahoe.sh
      - name: Compile and run input capability classification tests
        run: |
          cc -std=c11 -Wall -Wextra -o /tmp/inputkind-test server/tests/inputkind_test.c
          /tmp/inputkind-test
      - name: Compile and run touchpad driver tests
        run: |
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -o /tmp/tp-test server/tests/tp_test.c server/src/tp/tp.c tests/touchpad-sim/gestures.c -lm
          /tmp/tp-test
